name: Build Checkpoint GH
on:
  push:
    branches: [master, github-sync]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 30
    steps:
      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git curl ca-certificates unzip python3
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update 3DS toolchain
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev 3ds-curl 3ds-mbedtls 3ds-zlib
      - name: Build packaging tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --branch makerom-v0.19.0 --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/project-ctr
          make -C /tmp/project-ctr/makerom deps
          make -C /tmp/project-ctr/makerom -j2
          install -m 755 /tmp/project-ctr/makerom/bin/makerom /usr/local/bin/makerom
          git clone --recursive https://github.com/diasurgical/bannertool.git /tmp/bannertool
          git -C /tmp/bannertool checkout 16d8c5a0ce02a5e06e64ab42275132fca57c04a2
          git -C /tmp/bannertool submodule update --init --recursive
          make -C /tmp/bannertool -j2
          install -m 755 "$(find /tmp/bannertool/output -type f -name bannertool -print -quit)" /usr/local/bin/bannertool
      - name: Test backup framing and disk errors
        run: |
          g++ -std=c++23 -Wall -Wextra -Icommon tests/githubsync-test.cpp common/transferprotocol.cpp -o /tmp/githubsync-test
          /tmp/githubsync-test
      - name: Prepare certificate bundle
        run: |
          curl --fail --location --retry 3 https://curl.se/ca/cacert.pem -o 3ds/assets/romfs/github-ca.pem
          test -s 3ds/assets/romfs/github-ca.pem
      - name: Build CIA and 3DSX
        run: make 3ds -j2
      - name: Verify separate TitleID
        run: python3 tools/verify-github-cia.py 3ds/out/Checkpoint_GH.cia
      - uses: actions/upload-artifact@v4
        with:
          name: Checkpoint-GH-3DS
          path: |
            3ds/out/Checkpoint_GH.cia
            3ds/out/Checkpoint_GH.3dsx
            docs/github-sync-fr.md
          if-no-files-found: error
